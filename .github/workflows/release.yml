name: Release

# 打标签即可发布：
#   git tag v1.13.0 && git push origin v1.13.0
# 标签必须与 gomoku/client/constants.py 中的 APP_VERSION 一致，否则发布失败。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的标签（vX.Y.Z），必须已存在于仓库"
        required: true
        type: string
      dry_run:
        description: "只构建与校验：不推送镜像、不创建 Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ------------------------------------------------------------------
  # 0. 解析并校验版本号（标签 <-> APP_VERSION）
  # ------------------------------------------------------------------
  resolve:
    name: 校验版本
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析标签并与 APP_VERSION 比对
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
          else
            tag="$GITHUB_REF_NAME"
          fi

          dry_run="$INPUT_DRY_RUN"
          if [ -z "$dry_run" ] || [ "$dry_run" = "false" ]; then
            dry_run="false"
          else
            dry_run="true"
          fi

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::标签格式非法：${tag}（应为 vX.Y.Z）"
            exit 1
          fi
          version="${tag#v}"

          app_version="$(sed -n 's/^APP_VERSION: Final\[str\] = "\(.*\)"$/\1/p' gomoku/client/constants.py)"
          if [ "$app_version" != "$version" ]; then
            echo "::error::版本不一致：标签 ${tag} 对应 ${version}，但 gomoku/client/constants.py 的 APP_VERSION 是 ${app_version}。请先更新版本号再打标签。"
            exit 1
          fi

          # 正式发布要求标签已存在于远端（避免 workflow_dispatch 触发的重复运行）
          if [ "$dry_run" = "false" ]; then
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::远端不存在标签 ${tag}。请先执行：git tag ${tag} && git push origin ${tag}"
              exit 1
            fi
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "dry_run=${dry_run}"
          } >> "$GITHUB_OUTPUT"
          echo "发布版本：${version}（dry_run=${dry_run}）"

  # ------------------------------------------------------------------
  # 1. 质量门禁（与 ci.yml 使用同一套带哈希的锁文件）
  # ------------------------------------------------------------------
  quality-lint:
    name: Ruff + Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-tools.lock
            server/requirements.lock
      - name: Install tools and server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-tools.lock -r server/requirements.lock
      - name: Lint
        run: ruff check gomoku tests server/app server/tests server/migrations main.py build.py run_server.py tools
      - name: Type check
        run: mypy gomoku/shared server/app

  quality-client:
    name: 客户端测试
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-tools.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock -r requirements-tools.lock
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  quality-server:
    name: 服务端测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            server/requirements-dev.lock
            requirements-tools.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r server/requirements-dev.lock -r requirements-tools.lock
      - name: Run tests
        run: python -m unittest discover -s server/tests -t . -v

  # ------------------------------------------------------------------
  # 2. 构建 Windows 客户端并组装发布包
  # ------------------------------------------------------------------
  build-windows:
    name: 构建 Windows 客户端
    runs-on: windows-latest
    timeout-minutes: 45
    needs: resolve
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Build with PyInstaller
        run: python build.py

      # 冒烟测试：以 offscreen 启动打包产物，确认能正常启动并报告出与标签一致的版本号。
      - name: Smoke test the packaged exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $logFile = Join-Path $env:LOCALAPPDATA "Gomoku\Gomoku\logs\gomoku.log"
          Remove-Item $logFile -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath "dist\Gomoku.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(180)
          $ok = $false
          try {
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) {
                Write-Output "::error::打包产物启动后立即退出，退出码 $($proc.ExitCode)"
                break
              }
              if (Test-Path $logFile) {
                $hit = Select-String -Path $logFile -Pattern "version=$env:VERSION" -Quiet -ErrorAction SilentlyContinue
                if ($hit) { $ok = $true; break }
              }
              Start-Sleep -Seconds 2
            }
          } finally {
            try { & taskkill.exe /F /T /PID $proc.Id 2>$null | Out-Null } catch { }
          }

          if (-not $ok) {
            Write-Output "::error::冒烟测试失败：180 秒内未在 $logFile 中发现 version=$env:VERSION"
            if (Test-Path $logFile) { Get-Content $logFile | Write-Output }
            exit 1
          }
          Write-Output "[OK] 打包产物启动正常，版本号与标签一致：$env:VERSION"

      - name: Collect release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          New-Item -ItemType Directory -Force -Path release/fonts | Out-Null
          Copy-Item dist/Gomoku.exe release/Gomoku.exe
          Copy-Item gomoku/client/assets/THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          Copy-Item gomoku/client/assets/fonts/OFL-*.txt release/fonts/

      - name: Zip and verify bundle
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          version = os.environ["VERSION"]
          root = Path("release")
          archive = Path(f"Gomoku-{version}-windows-x64.zip")
          exe = Path("dist/Gomoku.exe")

          if not exe.exists():
              raise SystemExit("[!] 未找到 dist/Gomoku.exe")
          size = exe.stat().st_size
          if size < 20 * 1024 * 1024:
              raise SystemExit(f"[!] exe 体积异常（{size} 字节），打包可能不完整")
          with exe.open("rb") as fh:
              if fh.read(2) != b"MZ":
                  raise SystemExit("[!] 产物不是有效的 Windows 可执行文件")

          required = [
              "Gomoku.exe",
              "THIRD_PARTY_NOTICES.md",
              "fonts/OFL-MaShanZheng.txt",
              "fonts/OFL-ZCOOLXiaoWei.txt",
          ]
          for name in required:
              if not (root / name).exists():
                  raise SystemExit(f"[!] 缺少发布文件：{root / name}")

          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for name in required:
                  zf.write(root / name, name)

          with zipfile.ZipFile(archive) as zf:
              names = {n.replace("\\", "/") for n in zf.namelist()}
              missing = [n for n in required if n not in names]
              if missing:
                  raise SystemExit(f"[!] 压缩包缺少：{missing}")
              bad = zf.testzip()
              if bad is not None:
                  raise SystemExit(f"[!] 压缩包损坏：{bad}")

          print(f"[OK] {archive}（{archive.stat().st_size / 1048576:.1f} MB，exe {size / 1048576:.1f} MB）")
          PY

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: gomoku-windows-x64
          path: Gomoku-${{ needs.resolve.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # 3. 构建并推送服务端镜像到 GHCR
  # ------------------------------------------------------------------
  build-server-image:
    name: 构建服务端镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ needs.resolve.outputs.dry_run != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/gomoku-server
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=${{ needs.resolve.outputs.tag }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ needs.resolve.outputs.dry_run != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # ------------------------------------------------------------------
  # 4. 创建 GitHub Release
  # ------------------------------------------------------------------
  release:
    name: 创建 Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - resolve
      - quality-lint
      - quality-client
      - quality-server
      - build-windows
      - build-server-image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: gomoku-windows-x64
          path: dist

      - name: Compose release notes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python tools/compose_release_notes.py

      # 只有真正创建 Release 这一步受 dry_run 门禁；前面的产物下载与说明生成
      # 始终执行，这样 dry_run 能完整演练到最后一步而不产生任何外部副作用。
      - name: Create GitHub Release
        if: ${{ needs.resolve.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/Gomoku-${VERSION}-windows-x64.zip" \
            --title "${VERSION}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            --latest
          echo "Release 已创建：$(gh release view "$TAG" --json url --jq .url)"
