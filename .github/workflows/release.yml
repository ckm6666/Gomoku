name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（例如 v1.12.0）；留空时使用当前 ref 名"
        required: false
        default: ""
      notes:
        description: "更新说明（写入 update.json 的 notes）；留空时回退到标签名"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build release artifacts
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Build with PyInstaller
        run: python build.py --fast

      - name: Resolve release tag
        id: meta
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:INPUT_TAG
          if (-not $tag) { $tag = $env:REF_NAME }
          if (-not $tag) { throw "无法确定发布标签" }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Stage release artifacts
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "dist\Gomoku.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe" }

          # 暂存目录：安装包按版本号改名，清单与安装包放在一起供工作流产物上传。
          $stage = "release"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          $target = Join-Path $stage "Gomoku-$env:VERSION.exe"
          Copy-Item $exe $target

          # 发布说明优先取手工输入，其次回退到标签名。
          $notes = $env:INPUT_NOTES
          if (-not $notes) { $notes = $env:TAG }
          $publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          # 清单只包含版本与说明：下载 URL 由服务端按自身地址生成，
          # sha256 也由服务端读取安装包后计算，客户端最终以服务端下发的哈希校验。
          $manifest = [ordered]@{
            version = $env:VERSION
            notes = $notes
            published_at = $publishedAt
          }
          $manifestPath = Join-Path $stage "update.json"
          # 用 utf8NoBOM 写盘：带 BOM 的 JSON 会让服务端/客户端 json 解析失败。
          $manifest | ConvertTo-Json | Set-Content -Path $manifestPath -Encoding utf8NoBOM

          # 校验没有写入 BOM。
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $manifestPath))
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "update.json 带有 BOM 头"
          }

          "--- release/update.json ---"
          Get-Content $manifestPath
          "--- release 文件列表 ---"
          Get-ChildItem $stage | ForEach-Object { "$($_.Name) ($($_.Length) bytes)" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gomoku-update-${{ steps.meta.outputs.version }}
          path: |
            release/Gomoku-${{ steps.meta.outputs.version }}.exe
            release/update.json
          if-no-files-found: error
          retention-days: 7
