name: CI

on:
  push:
    branches: ["main", "ckm"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-tools.lock
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-tools.lock
      - name: Lint
        run: ruff check gomoku tests server/app server/tests server/migrations main.py build.py run_server.py tools

  types:
    name: Mypy (shared + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-tools.lock
            server/requirements.lock
      - name: Install tools and server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-tools.lock -r server/requirements.lock
      - name: Type check
        run: mypy gomoku/shared server/app

  client-tests:
    name: Client tests (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-tools.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock -r requirements-tools.lock
      - name: Run tests with coverage
        run: |
          python -m coverage run --branch --source=gomoku -m unittest discover -s tests -t . -v
          python -m coverage report

  server-tests:
    name: Server tests (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            server/requirements-dev.lock
            requirements-tools.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r server/requirements-dev.lock -r requirements-tools.lock
      - name: Run tests with coverage
        run: |
          python -m coverage run --branch --source=server -m unittest discover -s server/tests -t . -v
          python -m coverage report

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f server/Dockerfile -t gomoku-server:ci .
      - name: Start container and check readiness
        run: |
          docker run -d --name gomoku-ci -p 8000:8000 \
            -e GOMOKU_SERVER_ENV=development \
            -e GOMOKU_JWT_SECRET=ci-test-secret-0123456789abcdef0123456789abcdef \
            -e GOMOKU_LOG_FORMAT=json \
            gomoku-server:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "readiness check failed" >&2
          docker logs gomoku-ci >&2 || true
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f gomoku-ci || true

  build-client:
    name: Build Windows exe
    runs-on: windows-latest
    needs: client-tests
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - name: Build with PyInstaller
        run: python build.py --fast --server-url https://ci.invalid --update-url https://ci.invalid/update.json --no-auto-update-check
      - name: Verify built exe
        run: python tools/build_test.py --skip-build --server-url https://ci.invalid --update-url https://ci.invalid/update.json --no-auto-update-check
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-windows
          path: dist/Gomoku.exe
          if-no-files-found: error
          retention-days: 7
