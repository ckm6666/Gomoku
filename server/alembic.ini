# Alembic configuration.
# Runtime sets sqlalchemy.url from server.app.migrations.
# For CLI autogenerate, set GOMOKU_DATABASE_URL first.
# Keep this file ASCII-only: Alembic reads it with the system locale encoding.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os
sqlalchemy.url =

[post_write_hooks]
